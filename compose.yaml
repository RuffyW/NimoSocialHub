name: nimo-social-hub
x-app: &app
  image: nimo-social-hub:0.1.0
  build: .
  restart: unless-stopped
  environment:
    NIMO_DATA: /state
    NIMO_ORIGIN: https://${NIMO_LAN_IP:-192.168.178.91}:${NIMO_PORT:-8443}
  volumes:
    - ${NIMO_STATE_DIR:-./runtime}:/state
  networks: [hub]
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp:size=600m,mode=1777
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "3"}
services:
  web:
    <<: *app
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    <<: *app
    command: [python, -m, app.worker]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      disable: true
  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      NIMO_LAN_IP: ${NIMO_LAN_IP:-192.168.178.91}
    ports:
      - "${NIMO_LAN_IP:-192.168.178.91}:${NIMO_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${NIMO_STATE_DIR:-./runtime}/caddy:/data
      - ${NIMO_STATE_DIR:-./runtime}/caddy-config:/config
    networks: [hub]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
networks:
  hub: {}
