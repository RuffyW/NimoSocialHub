<form action="/publications" method="post" class="form-grid"><input type="hidden" name="csrf" value="{{csrf}}">{% if draft %}<input type="hidden" name="draft_id" value="{{draft.id}}">{% else %}<label>Format<select name="format">{% for key,label in formats.items() %}<option value="{{key}}">{{label}}</option>{% endfor %}</select></label><label>Veröffentlichte Caption<textarea name="caption" rows="3"></textarea></label>{% endif %}<label>Instagram-Link<input name="permalink" type="url" required placeholder="https://www.instagram.com/p/…/"></label><label>Tatsächlich veröffentlicht<input type="datetime-local" name="published_at" required></label><label>Bei doppelter Uhrzeit<select name="fold"><option value="">Automatisch, wenn eindeutig</option value="0">Erste Uhrzeit (Sommerzeit)</option><option value="1">Zweite Uhrzeit (Normalzeit)</option></select></label><button class="primary">Veröffentlichung erfassen</button><p class="hint">Speichert nur den Nachweis im Hub. Veröffentlicht nichts auf Instagram.</p></form>
