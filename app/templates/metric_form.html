<form action="/observations" method="post" class="form-grid"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="entry_id" value="{{nonce()}}"><input type="hidden" name="publication_id" value="{{publication.id if publication else ''}}"><label>Kennzahl<select name="metric">{% for key,m in metrics.items() if m.scope=='both' or m.scope==('publication' if publication else 'account') %}<option value="{{key}}">{{m.label}} ({{m.unit}})</option>{% endfor %}</select></label><label>Wert<input name="value" inputmode="decimal" placeholder="Leer bedeutet fehlend"></label><label>Falls kein Wert vorliegt<select name="reason">{% for key,label in reasons.items() %}<option value="{{key}}">{{label}}</option>{% endfor %}</select></label><label>Gemessen am · Berlin<input type="datetime-local" name="observed_at" required></label><label>Bezugszeitraum von<input type="datetime-local" name="period_start"></label><label>Bezugszeitraum bis<input type="datetime-local" name="period_end"></label><label>Bei doppelter Uhrzeit<select name="fold"><option value="">Automatisch, wenn eindeutig</option><option value="0">Erste Uhrzeit</option><option value="1">Zweite Uhrzeit</option></select></label><button class="primary">Messwert speichern</button><p class="hint wide">Beitrags-Gesamtwerte: Zeitraum leer lassen. Konto-Werte: Zeitraum angeben; Followerbestand ist eine Momentaufnahme. Quelle: manuell.</p></form>
