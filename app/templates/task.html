<li class="task" id="task-{{task.id}}"><form action="/tasks/{{task.id}}/toggle" method="post" hx-post="/tasks/{{task.id}}/toggle" hx-target="#task-{{task.id}}" hx-swap="outerHTML"><input type="hidden" name="csrf" value="{{csrf}}"><button class="check" aria-label="{{'Wieder öffnen' if task.done else 'Erledigen'}}: {{task.text}}">{{'✓' if task.done else '○'}}</button></form><div {% if task.done %}class="completed"{% endif %}>{{task.text}}<small class="{% if task.due_at and task.due_at < now and not task.done %}warning{% endif %}">{{task.due_at|date}}</small></div></li>
